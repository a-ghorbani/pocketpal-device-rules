name: links

# Upstream deletes and re-uploads files without telling us, and a merge only reaches users once
# jsDelivr's @main cache is purged. Neither shows up in a PR diff, so this runs on a schedule and
# opens an issue when it breaks.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - id: check
        name: Download URLs + Hugging Face metadata + jsDelivr freshness
        run: python3 tools/check_rules.py urls hf cdn 2>&1 | tee result.txt
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              'The scheduled `links` run failed. A model file was deleted or re-uploaded upstream,',
              'or jsDelivr is still serving a stale copy of `@main`.',
              '',
              '```',
              fs.readFileSync('result.txt', 'utf8').slice(-5000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const title = 'links check failed: a model URL or the CDN needs attention';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automated-links-check',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automated-links-check'],
              });
            }
